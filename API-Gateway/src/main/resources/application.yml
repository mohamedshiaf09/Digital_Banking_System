server:
  port: 8080

spring:
  application:
    name: API-GATEWAY

  main:
    web-application-type: reactive

  cloud:
    gateway:
      server:
        webflux:
          routes:

            - id: customer-service
              uri: http://localhost:8081
              predicates:
                - Path=/customers/**

            - id: account-service
              uri: http://localhost:8082
              predicates:
                - Path=/accounts/**

            - id: transaction-service
              uri: http://localhost:8083
              predicates:
                - Path=/transactions/**

            - id: loan-service
              uri: http://localhost:8084
              predicates:
                - Path=/loans/**