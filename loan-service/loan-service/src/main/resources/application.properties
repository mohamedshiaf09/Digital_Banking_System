# Server Port
server.port=8084

# Application Name
spring.application.name=loan-service

# H2 Database Configuration (in-memory)
spring.datasource.url=jdbc:h2:mem:loandb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate / JPA settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (view data in browser)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Account Service URL (for RestTemplate calls)
account.service.url=http://localhost:8082/accounts

# Transaction Service URL (for RestTemplate calls)
transaction.service.url=http://localhost:8083
